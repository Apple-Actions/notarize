name: test

run-name: test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (workaround)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: test
        run: yarn test

  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Reject unsupported path
        run: |
          set +e
          output=$(env \
            'INPUT_PATH=README.md' \
            'INPUT_ISSUER-ID=dummy' \
            'INPUT_API-KEY-ID=dummy' \
            'INPUT_API-PRIVATE-KEY=dummy' \
            'INPUT_STAPLE=true' \
            node dist/index.js)
          code=$?
          set -e
          # Strip the workflow-command prefix so the expected failure isn't
          # reported as an annotation on this run.
          echo "${output//::/: :}"
          test "$code" -ne 0 || { echo "::error::Expected a non-zero exit code"; exit 1; }
          echo "$output" | grep -qF '::error::`path` must end in .dmg, .pkg, .zip, .app: README.md' \
            || { echo "::error::Expected the allowed extensions in the failure message"; exit 1; }

      - name: Reject missing file
        run: |
          set +e
          output=$(env \
            'INPUT_PATH=missing.dmg' \
            'INPUT_ISSUER-ID=dummy' \
            'INPUT_API-KEY-ID=dummy' \
            'INPUT_API-PRIVATE-KEY=dummy' \
            'INPUT_STAPLE=true' \
            node dist/index.js)
          code=$?
          set -e
          echo "${output//::/: :}"
          test "$code" -ne 0 || { echo "::error::Expected a non-zero exit code"; exit 1; }
          echo "$output" | grep -qF '::error::Not found: missing.dmg' \
            || { echo "::error::Expected a not-found failure message"; exit 1; }
